<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><title>Generative Studio | Sentiric Lab</title>
  <script type="module" crossorigin src="/sentiric-playground/assets/media-studio-DS_qy1SE.js"></script>
  <link rel="modulepreload" crossorigin href="/sentiric-playground/assets/sdk-provider-BB4zdkWr.js">
  <link rel="stylesheet" crossorigin href="/sentiric-playground/assets/media-studio-iJEjaSRz.css">
</head>
<body>
    <div class="studio-layout">
        <header>
            <a href="/sentiric-playground/">← Lab</a>
            <div class="title">🎬 GENERATIVE MEDIA STUDIO</div>
            <div id="status" class="status-badge">READY</div>
        </header>

        <main class="canvas">
            <div id="player-container" class="player-container">
                <div class="empty-state">
                    <i class="icon">✨</i>
                    <p>Enter a prompt to generate cinematic video.</p>
                </div>
            </div>
        </main>

        <footer class="controls">
            <select id="modelSelect">
                <option value="ltx">LTX-Video (T2V - Hızlı)</option>
                <option value="wan2gp">Wan2.1 (T2V - Detaylı)</option>
                <option value="cogvideo">CogVideoX (T2V - Alternatif)</option>
            </select>
            <input type="text" id="promptInput" placeholder="A futuristic cyberpunk city in rain, neon lights, 4k, cinematic..." autocomplete="off" />
            <button id="genBtn">GENERATE</button>
        </footer>
    </div>
</body>
</html>
